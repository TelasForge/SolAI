name: Release Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          for bin in solai solaid; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o "${bin}-linux-${arch}" "./cmd/${bin}"
            done
          done

      - name: Generate checksums
        run: sha256sum solai-linux-amd64 solai-linux-arm64 solaid-linux-amd64 solaid-linux-arm64 > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            solai-linux-amd64
            solai-linux-arm64
            solaid-linux-amd64
            solaid-linux-arm64
            checksums.txt
